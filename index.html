<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動漫新集數追蹤</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #111; color: #eee; padding: 20px 16px; max-width: 600px; margin: auto; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 20px; color: #fff; }
  .add-row { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] { flex: 1; background: #222; border: 0.5px solid #444; color: #eee; border-radius: 10px; padding: 12px 14px; font-size: 16px; outline: none; }
  input[type="text"]:focus { border-color: #888; }
  button { background: #333; border: 0.5px solid #555; color: #eee; border-radius: 10px; padding: 12px 16px; font-size: 16px; cursor: pointer; white-space: nowrap; }
  button:active { background: #444; }
  button.primary { background: #c00; border-color: #e00; color: #fff; }
  button.primary:active { background: #e00; }
  .anime-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .anime-item { background: #1e1e1e; border: 0.5px solid #333; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .anime-name { flex: 1; font-size: 15px; line-height: 1.4; }
  .season-ctrl { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .season-btn { background: #333; border: 0.5px solid #555; color: #eee; border-radius: 8px; width: 36px; height: 36px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .season-btn:active { background: #444; }
  .season-label { font-size: 14px; color: #aaa; min-width: 44px; text-align: center; }
  .del-btn { background: none; border: none; color: #555; font-size: 22px; cursor: pointer; padding: 0 4px; flex-shrink: 0; }
  .del-btn:active { color: #f55; }
  .results { display: flex; flex-direction: column; gap: 14px; }
  .video-card { background: #1a1a1a; border: 0.5px solid #333; border-radius: 12px; overflow: hidden; display: flex; gap: 12px; padding: 12px; text-decoration: none; color: inherit; }
  .video-card:active { border-color: #666; }
  .thumb { width: 130px; min-width: 130px; height: 74px; object-fit: cover; border-radius: 8px; background: #333; }
  .info { flex: 1; overflow: hidden; }
  .title { font-size: 15px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 6px; }
  .meta { font-size: 13px; color: #888; }
  .section-title { font-size: 14px; color: #888; margin-bottom: 10px; margin-top: 6px; }
  .loading { text-align: center; color: #888; font-size: 16px; padding: 24px; }
  .empty { text-align: center; color: #555; font-size: 15px; padding: 16px; }
  .error { color: #f55; font-size: 14px; padding: 8px 0; }
</style>
</head>
<body>
<h1>動漫新集數追蹤</h1>

<div class="add-row">
  <input type="text" id="keywordInput" placeholder="輸入片名關鍵字" />
  <button onclick="addAnime()">新增</button>
  <button class="primary" onclick="searchAll()">搜尋全部</button>
</div>

<div class="anime-list" id="animeList"></div>
<div id="results" class="results"></div>

<script>
const API_KEY = 'AIzaSyAhQt6ZK9IdKGQ0BrBPQYFsxQPP2EJ0C_U';
const STORAGE_KEY = 'anime_list_v2';

const DEFAULT_LIST = [
  { name: '开局大帝我的弟子', season: 1 },
  { name: '大佬到宗门当弟子', season: 1 },
  { name: '寒山枭雄', season: 1 },
  { name: '女帝逼走我后才发现我无敌天下', season: 1 },
  { name: '毒手巫醫', season: 1 },
  { name: '苏家有个小道姑捉鬼画符', season: 1 },
  { name: '隐居魔帝和离后我不装了', season: 1 },
  { name: '摊牌女儿其实爹已世间无敌', season: 1 },
  { name: '九龙帝尊', season: 1 },
  { name: '他下界签到万年', season: 1 }
];

function getList() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) return JSON.parse(stored);
  saveList(DEFAULT_LIST);
  return DEFAULT_LIST;
}

function saveList(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

function renderList() {
  const list = getList();
  const el = document.getElementById('animeList');
  el.innerHTML = list.map((a, i) => `
    <div class="anime-item">
      <div class="anime-name">${a.name}</div>
      <div class="season-ctrl">
        <button class="season-btn" onclick="changeSeason(${i}, -1)">−</button>
        <span class="season-label">S${a.season}</span>
        <button class="season-btn" onclick="changeSeason(${i}, 1)">+</button>
      </div>
      <button class="del-btn" onclick="removeAnime(${i})">×</button>
    </div>
  `).join('');
}

function addAnime() {
  const input = document.getElementById('keywordInput');
  const val = input.value.trim();
  if (!val) return;
  const list = getList();
  if (!list.find(a => a.name === val)) {
    list.push({ name: val, season: 1 });
    saveList(list);
    renderList();
  }
  input.value = '';
}

function removeAnime(i) {
  const list = getList();
  list.splice(i, 1);
  saveList(list);
  renderList();
}

function changeSeason(i, delta) {
  const list = getList();
  list[i].season = Math.max(1, list[i].season + delta);
  saveList(list);
  renderList();
}

document.getElementById('keywordInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addAnime();
});

const SEASON_MAP = ['一','二','三','四','五','六','七','八','九','十'];

async function searchYT(query) {
  const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&order=date&maxResults=4&key=${API_KEY}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('API 錯誤 ' + res.status);
  const data = await res.json();
  return data.items || [];
}

function timeAgo(dateStr) {
  const diff = (Date.now() - new Date(dateStr)) / 1000;
  if (diff < 3600) return Math.floor(diff / 60) + ' 分鐘前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小時前';
  if (diff < 86400 * 30) return Math.floor(diff / 86400) + ' 天前';
  return new Date(dateStr).toLocaleDateString('zh-TW');
}

function buildQuery(anime) {
  const nextSeason = anime.season + 1;
  const zh = SEASON_MAP[nextSeason - 1] || nextSeason;
  return `${anime.name} 第${zh}季`;
}

async function searchAll() {
  const list = getList();
  if (list.length === 0) {
    document.getElementById('results').innerHTML = '<div class="empty">請先新增片名</div>';
    return;
  }
  document.getElementById('results').innerHTML = '<div class="loading">搜尋中⋯</div>';
  let html = '';
  for (const anime of list) {
    const query = buildQuery(anime);
    html += `<div class="section-title">「${anime.name}」第${anime.season + 1}季新影片</div>`;
    try {
      const items = await searchYT(query);
      const filtered = items.filter(item => item.snippet.title.includes(anime.name.slice(0, 4)));
      const show = filtered.length > 0 ? filtered : items;
      if (show.length === 0) {
        html += `<div class="empty">找不到第${anime.season + 1}季相關影片</div>`;
      } else {
        for (const item of show.slice(0, 3)) {
          const vid = item.id.videoId;
          const s = item.snippet;
          const thumb = s.thumbnails?.medium?.url || '';
          html += `
            <a class="video-card" href="https://www.youtube.com/watch?v=${vid}" target="_blank">
              <img class="thumb" src="${thumb}" alt="" />
              <div class="info">
                <div class="title">${s.title}</div>
                <div class="meta">${s.channelTitle} · ${timeAgo(s.publishedAt)}</div>
              </div>
            </a>`;
        }
      }
    } catch (e) {
      html += `<div class="error">搜尋失敗：${e.message}</div>`;
    }
  }
  document.getElementById('results').innerHTML = html;
}

renderList();
</script>
</body>
</html>
