<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動漫新集數追蹤</title>
<style>
  :root {
    --bg: #f2f2f7; --surface: #fff; --surface2: #f0f0f0;
    --border: #e0e0e0; --divider: #e0e0e0;
    --text: #111; --text2: #444; --text3: #888;
    --input-bg: #fff; --btn-bg: #e5e5ea; --btn-border: #d0d0d0; --btn-text: #111;
    --accent: #c00; --accent2: #e00;
    --star: #f5a623; --clock: #4a90e2; --check: #1a7a4a; --cross: #a00;
    --star-bg: #fff8e6; --clock-bg: #e8f0fc; --check-bg: #e8f5ee; --cross-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --surface: #2c2c2e; --surface2: #3a3a3c;
      --border: #3a3a3c; --divider: #3a3a3c;
      --text: #f2f2f7; --text2: #ccc; --text3: #888;
      --input-bg: #2c2c2e; --btn-bg: #3a3a3c; --btn-border: #555; --btn-text: #f2f2f7;
      --accent: #ff453a; --accent2: #ff6961;
      --star: #ffd60a; --clock: #64a8ff; --check: #30d158; --cross: #ff453a;
      --star-bg: #2a2410; --clock-bg: #10203a; --check-bg: #0f2a1a; --cross-bg: #2a0f0f;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px 16px; max-width: 600px; margin: auto; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .user-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 12px; color: var(--text3); }
  .user-id { font-family: monospace; font-size: 11px; background: var(--surface2); padding: 2px 8px; border-radius: 6px; cursor: pointer; }
  .tabs { display: flex; gap: 6px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
  .tab { flex-shrink: 0; padding: 8px 16px; font-size: 14px; font-weight: 600; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text3); cursor: pointer; }
  .tab.active { background: var(--accent); border-color: var(--accent2); color: #fff; }
  .add-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .url-row { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] { flex: 1; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 12px 14px; font-size: 16px; outline: none; }
  input[type="text"]::placeholder { color: var(--text3); }
  input[type="text"]:focus { border-color: #888; }
  select { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 12px 10px; font-size: 15px; outline: none; flex-shrink: 0; }
  button { background: var(--btn-bg); border: 1px solid var(--btn-border); color: var(--btn-text); border-radius: 10px; padding: 12px 16px; font-size: 16px; cursor: pointer; white-space: nowrap; font-weight: 500; }
  button:active { opacity: 0.7; }
  button.primary { background: var(--accent); border-color: var(--accent2); color: #fff; }
  button.blue { background: #4a90e2; border-color: #357abd; color: #fff; }
  .anime-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .anime-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .anime-name { flex: 1; font-size: 15px; line-height: 1.4; cursor: pointer; border-bottom: 1px dashed var(--border); padding-bottom: 2px; }
  .anime-name-input { flex: 1; background: var(--input-bg); border: 1px solid #888; color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 15px; outline: none; }
  .season-ctrl { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .season-btn { background: var(--btn-bg); border: 1px solid var(--btn-border); color: var(--btn-text); border-radius: 8px; width: 36px; height: 36px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; font-weight: 600; }
  .season-label { font-size: 14px; color: var(--text2); min-width: 44px; text-align: center; font-weight: 600; }
  .del-btn { background: none; border: none; color: var(--text3); font-size: 22px; cursor: pointer; padding: 0 4px; }
  .video-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; margin-bottom: 12px; }
  .group-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
  .group-title { font-size: 14px; font-weight: 600; color: var(--text); padding: 12px 14px 8px; }
  .group-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 0 14px 12px; scrollbar-width: none; }
  .group-scroll::-webkit-scrollbar { display: none; }
  .group-item { flex-shrink: 0; width: 110px; cursor: pointer; }
  .group-item a { text-decoration: none; color: inherit; }
  .group-thumb-wrap { position: relative; width: 110px; height: 62px; border-radius: 8px; overflow: hidden; background: var(--surface2); margin-bottom: 5px; }
  .group-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
  .group-dur { position: absolute; bottom: 3px; right: 3px; background: rgba(0,0,0,0.75); color: #fff; font-size: 10px; padding: 1px 4px; border-radius: 3px; font-weight: 600; }
  .group-label { font-size: 12px; color: var(--text2); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .group-remove { font-size: 11px; color: var(--text3); margin-top: 3px; cursor: pointer; }
  .group-actions { border-top: 1px solid var(--divider); display: flex; }
  .video-main { display: flex; gap: 12px; padding: 12px; }
  .video-main a { flex-shrink: 0; display: block; }
  .thumb-wrap { position: relative; width: 130px; min-width: 130px; height: 74px; flex-shrink: 0; }
  .thumb { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; background: var(--surface2); display: block; }
  .duration { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.75); color: #fff; font-size: 12px; padding: 1px 5px; border-radius: 4px; font-weight: 600; }
  .info { flex: 1; overflow: hidden; }
  .vtitle { font-size: 15px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
  [id^="list-"] .vtitle { border-bottom: 1px dashed var(--border); padding-bottom: 2px; cursor: pointer; }
  .meta { font-size: 13px; color: var(--text3); }
  .video-actions { display: flex; border-top: 1px solid var(--divider); }
  .act { flex: 1; padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; border: none; background: none; color: var(--text3); }
  .act:not(:last-child) { border-right: 1px solid var(--divider); }
  .act.star:active { background: var(--star-bg); color: var(--star); }
  .act.clock:active { background: var(--clock-bg); color: var(--clock); }
  .act.check:active { background: var(--check-bg); color: var(--check); }
  .act.cross:active { background: var(--cross-bg); color: var(--cross); }
  .section-title { font-size: 14px; color: var(--text3); margin-bottom: 10px; margin-top: 6px; font-weight: 500; }
  .loading { text-align: center; color: var(--text3); font-size: 16px; padding: 24px; }
  .empty-state { text-align: center; color: var(--text3); font-size: 14px; padding: 30px 0; }
  .note { text-align: center; color: var(--text3); font-size: 12px; padding: 4px 0 8px; }
  .error { color: var(--cross); font-size: 14px; padding: 8px 0; text-align: center; }
  .page { display: none; }
  .page.active { display: block; }
  .clear-btn { font-size: 13px; color: var(--cross); background: none; border: none; padding: 4px 8px; cursor: pointer; float: right; }
  .url-hint { font-size: 12px; color: var(--text3); margin-bottom: 8px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: var(--surface); border-radius: 16px; padding: 24px; width: 90%; max-width: 360px; }
  .modal h3 { font-size: 17px; margin-bottom: 12px; }
  .modal p { font-size: 13px; color: var(--text3); margin-bottom: 16px; line-height: 1.5; }
  .modal input { width: 100%; margin-bottom: 12px; }
  .modal-btns { display: flex; gap: 8px; }
  .modal-btns button { flex: 1; }
</style>
</head>
<body>
<h1>動漫新集數追蹤</h1>
<div class="user-bar">
  我的 ID：<span class="user-id" id="userIdDisplay" onclick="showIdModal()" title="點擊管理 ID">載入中...</span>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('search')">🔍 搜尋</div>
  <div class="tab" onclick="switchTab('watchlist')">🕐 待觀看</div>
  <div class="tab" onclick="switchTab('favorites')">⭐ 收藏</div>
  <div class="tab" onclick="switchTab('watched')">✓ 已看過</div>
</div>

<div class="page active" id="page-search">
  <div class="add-row">
    <input type="text" id="keywordInput" placeholder="輸入片名關鍵字" />
    <button onclick="addAnime()">新增</button>
    <button class="primary" onclick="searchAll()">搜尋</button>
  </div>
  <div class="url-hint">📎 貼 YouTube 網址直接加入清單：</div>
  <div class="url-row">
    <input type="text" id="urlInput" placeholder="https://youtube.com/watch?v=..." />
    <select id="urlTarget">
      <option value="favorites">⭐ 收藏</option>
      <option value="watchlist">🕐 待看</option>
      <option value="watched">✓ 已看過</option>
    </select>
    <button class="blue" onclick="addByUrl()">加入</button>
  </div>
  <div id="urlStatus"></div>
  <div class="anime-list" id="animeList"></div>
  <div id="results"></div>
</div>

<div class="page" id="page-watchlist">
  <button class="clear-btn" onclick="clearList('watchlist')">清除全部</button>
  <div style="clear:both;margin-bottom:12px;"></div>
  <div id="list-watchlist"></div>
</div>
<div class="page" id="page-favorites">
  <button class="clear-btn" onclick="clearList('favorites')">清除全部</button>
  <div style="clear:both;margin-bottom:12px;"></div>
  <div id="list-favorites"></div>
</div>
<div class="page" id="page-watched">
  <button class="clear-btn" onclick="clearList('watched')">清除全部</button>
  <div style="clear:both;margin-bottom:12px;"></div>
  <div id="list-watched"></div>
</div>

<!-- ID 管理 Modal -->
<div class="modal-overlay" id="idModal" style="display:none">
  <div class="modal">
    <h3>我的使用者 ID</h3>
    <p>這是你的專屬 ID，資料與此 ID 綁定。換裝置時輸入同一個 ID 即可同步資料。</p>
    <input type="text" id="modalIdInput" placeholder="輸入 ID" />
    <div class="modal-btns">
      <button onclick="closeIdModal()">取消</button>
      <button class="primary" onclick="applyId()">切換</button>
    </div>
  </div>
</div>

<script>
const YT_KEY = 'AIzaSyAhQt6ZK9IdKGQ0BrBPQYFsxQPP2EJ0C_U';
const SB_URL = 'https://pqcnlabcbkvmwtgzszws.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxY25sYWJjYmt2bXd0Z3pzendzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NDA3OTgsImV4cCI6MjEwNTUxNjc5OH0.Ng9xpXApuBJedviOqqBpaZHN9yu5o7hHHlwiqWwESy0';

function sbFetch(path, opts={}) {
  return fetch(SB_URL+'/rest/v1/'+path, {
    ...opts,
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer '+SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal', ...(opts.headers||{}) }
  });
}

// 用戶 ID
let USER_ID = localStorage.getItem('anime_user_id');
if (!USER_ID) { USER_ID = 'u_'+Math.random().toString(36).slice(2,10); localStorage.setItem('anime_user_id', USER_ID); }
document.getElementById('userIdDisplay').textContent = USER_ID;

function showIdModal() {
  document.getElementById('modalIdInput').value = USER_ID;
  document.getElementById('idModal').style.display = 'flex';
}
function closeIdModal() { document.getElementById('idModal').style.display = 'none'; }
function applyId() {
  const val = document.getElementById('modalIdInput').value.trim();
  if (!val) return;
  USER_ID = val; localStorage.setItem('anime_user_id', USER_ID);
  document.getElementById('userIdDisplay').textContent = USER_ID;
  closeIdModal(); renderAnimeList();
}

// Supabase CRUD
async function sbGetAnime() {
  const r = await sbFetch(`anime_list?user_id=eq.${USER_ID}&order=created_at.asc`);
  return await r.json();
}
async function sbAddAnime(name, season) {
  await sbFetch('anime_list', { method:'POST', body: JSON.stringify({user_id:USER_ID, name, season}) });
}
async function sbUpdateAnime(id, fields) {
  await sbFetch(`anime_list?id=eq.${id}`, { method:'PATCH', body: JSON.stringify(fields) });
}
async function sbDeleteAnime(id) {
  await sbFetch(`anime_list?id=eq.${id}`, { method:'DELETE' });
}

async function sbGetVideos(type) {
  const r = await sbFetch(`video_list?user_id=eq.${USER_ID}&list_type=eq.${type}&order=created_at.desc`);
  return await r.json();
}
async function sbAddVideo(type, v) {
  await sbFetch('video_list', { method:'POST', headers:{'Prefer':'resolution=ignore-duplicates'}, body: JSON.stringify({user_id:USER_ID, list_type:type, video_id:v.id, title:v.title, channel:v.channel, ago:v.ago, thumb:v.thumb, dur:v.dur}) });
}
async function sbDeleteVideo(type, vid) {
  await sbFetch(`video_list?user_id=eq.${USER_ID}&list_type=eq.${type}&video_id=eq.${vid}`, { method:'DELETE' });
}
async function sbClearVideos(type) {
  await sbFetch(`video_list?user_id=eq.${USER_ID}&list_type=eq.${type}`, { method:'DELETE' });
}

async function sbGetHidden() {
  const r = await sbFetch(`hidden_videos?user_id=eq.${USER_ID}&select=video_id`);
  const data = await r.json();
  return data.map(d=>d.video_id);
}
async function sbAddHidden(vid) {
  await sbFetch('hidden_videos', { method:'POST', headers:{'Prefer':'resolution=ignore-duplicates'}, body: JSON.stringify({user_id:USER_ID, video_id:vid}) });
}

// 分頁
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['search','watchlist','favorites','watched'][i]===tab));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  if(tab!=='search') renderVList(tab);
}

// 追蹤清單
let animeCache = [];
async function renderAnimeList() {
  document.getElementById('animeList').innerHTML='<div class="loading">載入中⋯</div>';
  animeCache = await sbGetAnime();
  document.getElementById('animeList').innerHTML = animeCache.map((a,i)=>`
    <div class="anime-item">
      <span class="anime-name" onclick="editName(${i},this)">${a.name}</span>
      <div class="season-ctrl">
        <button class="season-btn" onclick="changeSeason(${i},-1)">−</button>
        <span class="season-label">S${a.season}</span>
        <button class="season-btn" onclick="changeSeason(${i},1)">+</button>
      </div>
      <button class="del-btn" onclick="removeAnime(${i})">×</button>
    </div>`).join('') || '<div class="empty-state">尚無追蹤片名</div>';
}

function editName(i, el) {
  const a = animeCache[i];
  const inp = document.createElement('input'); inp.type='text'; inp.className='anime-name-input'; inp.value=a.name;
  el.replaceWith(inp); inp.focus(); inp.select();
  async function save() {
    const v=inp.value.trim();
    if(v && v!==a.name) { a.name=v; await sbUpdateAnime(a.id,{name:v}); }
    renderAnimeList();
  }
  inp.addEventListener('blur',save);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape')renderAnimeList();});
}

async function addAnime() {
  const inp=document.getElementById('keywordInput'), val=inp.value.trim(); if(!val) return;
  inp.value='';
  await sbAddAnime(val, 0);
  renderAnimeList();
}

async function removeAnime(i) {
  await sbDeleteAnime(animeCache[i].id);
  renderAnimeList();
}

async function changeSeason(i, d) {
  const a=animeCache[i];
  const ns=Math.max(0,a.season+d);
  a.season=ns;
  document.querySelectorAll('.season-label')[i].textContent='S'+ns;
  await sbUpdateAnime(a.id,{season:ns});
}

document.getElementById('keywordInput').addEventListener('keydown',e=>{if(e.key==='Enter')addAnime();});

// 去掉末尾季數標記取得分組用主體片名
function baseTitle(title) {
  if (!title) return '';
  let t = title;
  t = t.replace(/[sS]\d+\s*[~～\-]\s*[sS]?\d+\s*$/, '');
  t = t.replace(/[sS]\d+\s*$/, '');
  t = t.replace(/第[一二三四五六七八九十百\d]+季.*$/, '');
  t = t.replace(/[\s·\-]+$/, '');
  return t.trim();
}

function isCustomTitle(t) {
  if (!t) return false;
  if (t.length > 40) return false;
  if (/^[【✨🔥💥⚡🎉🎊ABCDEFGHIJKLMNOPQRSTUVWXYZ]/.test(t)) return false;
  return true;
}

// 群組式影片清單
async function renderVList(type) {
  const el=document.getElementById('list-'+type);
  el.innerHTML='<div class="loading">載入中⋯</div>';
  const rows=await sbGetVideos(type);
  if(!rows.length){el.innerHTML='<div class="empty-state">尚無影片</div>';return;}
  const items=rows.map(row=>({id:row.video_id,title:row.title,channel:row.channel,ago:row.ago,thumb:row.thumb,dur:row.dur}));

  const groups={}, order=[];
  for(const v of items){
    const key = isCustomTitle(v.title) ? (baseTitle(v.title)||v.title) : ('__solo__'+v.id);
    if(!groups[key]){groups[key]=[];order.push(key);}
    groups[key].push(v);
  }

  let html='';
  for(const key of order){
    const group=groups[key];
    if(group.length===1 || key.startsWith('__solo__')){
      html+=videoCardHTML(group[0],type);
    } else {
      // 群組卡片
      const groupLabel = key;
      const vJson = group.map(v=>JSON.stringify(v).replace(/"/g,'&quot;'));
      let thumbs='';
      group.forEach((v,i)=>{
        const removeAction = type==='watched'
          ? `<button class="act star" onclick="moveToFavorites(${vJson[i]})" style="font-size:11px;padding:4px 2px;flex:1;border-right:1px solid var(--divider);">⭐</button><button class="act cross" onclick="removeVideo('${type}','${v.id}');renderVList('${type}')" style="font-size:11px;padding:4px 2px;flex:1;">✕</button>`
          : `<button class="act cross" onclick="removeVideo('${type}','${v.id}');renderVList('${type}')" style="font-size:11px;padding:4px;width:100%;">✕ 移除</button>`;
        thumbs+=`
          <div class="group-item" id="gitem-${v.id}">
            <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank">
              <div class="group-thumb-wrap">
                <img class="group-thumb" src="${v.thumb}" alt="" />
                ${v.dur?`<span class="group-dur">${v.dur}</span>`:''}
              </div>
              <div class="group-label" onclick="event.preventDefault();editGroupTitle(event,'${v.id}','${type}')">${v.title}</div>
            </a>
            <div style="display:flex;margin-top:4px;">${removeAction}</div>
          </div>`;
      });
      html+=`
        <div class="group-card">
          <div class="group-title">${groupLabel}</div>
          <div class="group-scroll" id="gscroll-${key.replace(/[^a-zA-Z0-9]/g,'_')}">${thumbs}</div>
        </div>`;
    }
  }
  el.innerHTML=html;
}

async function editGroupTitle(e, vid, type) {
  e.preventDefault(); e.stopPropagation();
  const el=e.target;
  const current=el.textContent;
  const inp=document.createElement('input');
  inp.type='text'; inp.value=current;
  inp.style.cssText='width:100%;font-size:12px;background:var(--input-bg);border:1px solid #888;color:var(--text);border-radius:4px;padding:2px 4px;outline:none;';
  el.replaceWith(inp); inp.focus(); inp.select();
  async function save(){
    const val=inp.value.trim()||current;
    inp.replaceWith(el); el.textContent=val;
    await sbFetch(`video_list?user_id=eq.${USER_ID}&list_type=eq.${type}&video_id=eq.${vid}`,{method:'PATCH',body:JSON.stringify({title:val})});
    renderVList(type);
  }
  inp.addEventListener('blur',save);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape'){inp.replaceWith(el);}});
}

function videoCardHTML(v, context, indented=false) {
  const indentStyle = indented ? 'margin-left:20px;border-left:3px solid var(--border);' : '';
  const isStored=['watchlist','favorites','watched'].includes(context);
  let actions='';
  if(!isStored){
    actions=`
      <button class="act star" onclick="saveVideo('favorites',${JSON.stringify(v).replace(/"/g,'&quot;')})">⭐ 收藏</button>
      <button class="act clock" onclick="saveVideo('watchlist',${JSON.stringify(v).replace(/"/g,'&quot;')})">🕐 待看</button>
      <button class="act check" onclick="saveAndHide('watched',${JSON.stringify(v).replace(/"/g,'&quot;')},'card-${v.id}')">✓ 已看過</button>
      <button class="act cross" onclick="justHide('${v.id}','card-${v.id}')">✕ 不相關</button>`;
  } else if(context==='watched'){
    actions=`
      <button class="act star" onclick="moveToFavorites(${JSON.stringify(v).replace(/"/g,'&quot;')})">⭐ 移至收藏</button>
      <button class="act cross" onclick="removeVideo('${context}','${v.id}')">✕ 移除</button>`;
  } else {
    actions=`<button class="act cross" onclick="removeVideo('${context}','${v.id}')">✕ 移除</button>`;
  }
  return `
    <div class="video-card" id="card-${v.id}" style="${indentStyle}">
      <div class="video-main">
        <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="flex-shrink:0;">
          <div class="thumb-wrap">
            <img class="thumb" src="${v.thumb}" alt="" />
            ${v.dur?`<span class="duration">${v.dur}</span>`:''}
          </div>
        </a>
        <div class="info">
          <div class="vtitle" onclick="editVideoTitle(event,'${v.id}','${context}')" title="點擊自訂名稱">${v.customTitle||v.title}</div>
          <div class="meta">${v.channel} · ${v.ago}</div>
        </div>
      </div>
      <div class="video-actions">${actions}</div>
    </div>`;
}

async function editVideoTitle(e, vid, context) {
  e.preventDefault(); e.stopPropagation();
  const el = e.target;
  const isStored = ['watchlist','favorites','watched'].includes(context);
  if (!isStored) return; // 搜尋結果不支援自訂
  const current = el.textContent;
  const inp = document.createElement('input');
  inp.type = 'text'; inp.value = current;
  inp.style.cssText = 'width:100%;font-size:15px;font-weight:600;background:var(--input-bg);border:1px solid #888;color:var(--text);border-radius:6px;padding:4px 8px;outline:none;';
  el.replaceWith(inp); inp.focus(); inp.select();
  async function save() {
    const val = inp.value.trim() || current;
    inp.replaceWith(el); el.textContent = val;
    await sbFetch(`video_list?user_id=eq.${USER_ID}&list_type=eq.${context}&video_id=eq.${vid}`, {
      method: 'PATCH', body: JSON.stringify({title: val})
    });
  }
  inp.addEventListener('blur', save);
  inp.addEventListener('keydown', e => { if(e.key==='Enter') inp.blur(); if(e.key==='Escape'){inp.replaceWith(el);} });
}

async function saveVideo(type,v){ await sbAddVideo(type,v); await sbAddHidden(v.id); const c=document.getElementById('card-'+v.id); if(c)c.remove(); }
async function saveAndHide(type,v,cardId){ await sbAddVideo(type,v); await sbAddHidden(v.id); const c=document.getElementById(cardId); if(c)c.remove(); }
async function justHide(vid,cardId){ await sbAddHidden(vid); const c=document.getElementById(cardId); if(c)c.remove(); }
async function moveToFavorites(v){ await sbAddVideo('favorites',v); await sbDeleteVideo('watched',v.id); renderVList('watched'); }
async function removeVideo(type,vid){ await sbDeleteVideo(type,vid); renderVList(type); }
async function clearList(type){ if(confirm('確定清除全部？')){await sbClearVideos(type);renderVList(type);} }

// 貼網址
function extractVideoId(url){ const m=url.match(/(?:v=|youtu\.be\/|shorts\/)([a-zA-Z0-9_-]{11})/); return m?m[1]:null; }
async function addByUrl(){
  const url=document.getElementById('urlInput').value.trim();
  const type=document.getElementById('urlTarget').value;
  const status=document.getElementById('urlStatus');
  const vid=extractVideoId(url);
  if(!vid){status.innerHTML='<div class="error">無法識別 YouTube 網址</div>';return;}
  status.innerHTML='<div class="loading">讀取影片資訊⋯</div>';
  try {
    const r=await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails&id=${vid}&key=${YT_KEY}`);
    const data=await r.json();
    const item=data.items?.[0];
    if(!item){status.innerHTML='<div class="error">找不到影片</div>';return;}
    const s=item.snippet;
    const v={id:vid,title:s.title,channel:s.channelTitle,ago:new Date(s.publishedAt).toLocaleDateString('zh-TW'),thumb:s.thumbnails?.medium?.url||'',dur:parseDur(item.contentDetails.duration)};
    await sbAddVideo(type,v);
    document.getElementById('urlInput').value='';
    status.innerHTML=`<div style="color:var(--check);font-size:14px;padding:8px 0;">✓ 已加入${{favorites:'收藏',watchlist:'待觀看',watched:'已看過'}[type]}</div>`;
    setTimeout(()=>status.innerHTML='',2000);
  } catch(e){status.innerHTML=`<div class="error">失敗：${e.message}</div>`;}
}

// YouTube 搜尋
const SEASON_MAP=['一','二','三','四','五','六','七','八','九','十'];
function seasonMatches(title,s){ const zh=SEASON_MAP[s-1]; return [`第${zh}季`,`第${s}季`,`S${s}`,`season ${s}`,`Season ${s}`].some(p=>title.includes(p)); }
async function searchYT(q){ const r=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(q)}&type=video&order=date&maxResults=10&key=${YT_KEY}`); if(!r.ok) throw new Error('API錯誤'); return (await r.json()).items||[]; }
async function getDurations(ids){ const r=await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${ids.join(',')}&key=${YT_KEY}`); if(!r.ok) return {}; const m={}; for(const i of (await r.json()).items||[]) m[i.id]=parseDur(i.contentDetails.duration); return m; }
function parseDur(iso){ const m=iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/); if(!m) return ''; const h=+m[1]||0,min=+m[2]||0,s=+m[3]||0; return h>0?`${h}:${String(min).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${min}:${String(s).padStart(2,'0')}`; }
function timeAgo(d){ const diff=(Date.now()-new Date(d))/1000; if(diff<3600) return Math.floor(diff/60)+' 分鐘前'; if(diff<86400) return Math.floor(diff/3600)+' 小時前'; if(diff<86400*30) return Math.floor(diff/86400)+' 天前'; return new Date(d).toLocaleDateString('zh-TW'); }

async function searchAll(){
  const list=animeCache;
  if(!list.length){document.getElementById('results').innerHTML='<div class="empty-state">請先新增片名</div>';return;}
  document.getElementById('results').innerHTML='<div class="loading">搜尋中⋯</div>';
  const hidden=await sbGetHidden(); let html='';
  for(const anime of list){
    const ns=anime.season===0?1:anime.season+1;
    const zh=SEASON_MAP[ns-1]||ns;
    const label=anime.season===0?'第1季（未看過）':`第${ns}季`;
    html+=`<div class="section-title">「${anime.name}」${label}新影片</div>`;
    try {
      const items=await searchYT(`${anime.name} 第${zh}季`);
      const filtered=items.filter(i=>seasonMatches(i.snippet.title,ns));
      const show=(filtered.length?filtered:items).filter(i=>!hidden.includes(i.id.videoId));
      const note=filtered.length===0?'<div class="note">（找不到精確季數，顯示相關影片）</div>':'';
      if(!show.length){html+=`<div class="empty-state" style="padding:12px">找不到${label}相關影片</div>`;continue;}
      html+=note;
      const durs=await getDurations(show.slice(0,5).map(i=>i.id.videoId));
      for(const item of show.slice(0,5)){
        const vid=item.id.videoId,s=item.snippet;
        const v={id:vid,title:s.title,channel:s.channelTitle,ago:timeAgo(s.publishedAt),thumb:s.thumbnails?.medium?.url||'',dur:durs[vid]||''};
        html+=videoCardHTML(v,'search');
      }
    } catch(e){html+=`<div class="error">搜尋失敗：${e.message}</div>`;}
  }
  document.getElementById('results').innerHTML=html;
}

renderAnimeList();
