<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動漫新集數追蹤</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #111; color: #eee; padding: 16px; max-width: 600px; margin: auto; }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 16px; color: #fff; }
  .add-row { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type="text"] { flex: 1; background: #222; border: 0.5px solid #444; color: #eee; border-radius: 8px; padding: 8px 12px; font-size: 14px; outline: none; }
  input[type="text"]:focus { border-color: #888; }
  button { background: #333; border: 0.5px solid #555; color: #eee; border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; white-space: nowrap; }
  button:hover { background: #444; }
  button.primary { background: #c00; border-color: #e00; color: #fff; }
  button.primary:hover { background: #e00; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .tag { background: #222; border: 0.5px solid #444; border-radius: 20px; padding: 4px 12px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .tag span { cursor: default; }
  .tag .del { cursor: pointer; color: #888; font-size: 16px; line-height: 1; }
  .tag .del:hover { color: #f55; }
  .results { display: flex; flex-direction: column; gap: 12px; }
  .video-card { background: #1a1a1a; border: 0.5px solid #333; border-radius: 12px; overflow: hidden; display: flex; gap: 12px; padding: 10px; cursor: pointer; text-decoration: none; color: inherit; }
  .video-card:hover { border-color: #666; }
  .thumb { width: 120px; min-width: 120px; height: 68px; object-fit: cover; border-radius: 6px; background: #333; }
  .info { flex: 1; overflow: hidden; }
  .title { font-size: 13px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
  .meta { font-size: 12px; color: #888; }
  .section-title { font-size: 13px; color: #888; margin-bottom: 8px; margin-top: 4px; }
  .loading { text-align: center; color: #888; font-size: 14px; padding: 20px; }
  .empty { text-align: center; color: #555; font-size: 14px; padding: 30px; }
  .error { color: #f55; font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>
<h1>動漫新集數追蹤</h1>

<div class="add-row">
  <input type="text" id="keywordInput" placeholder="輸入片名，例如：荒歲福崇" />
  <button onclick="addKeyword()">新增</button>
  <button class="primary" onclick="searchAll()">搜尋全部</button>
</div>

<div class="tag-list" id="tagList"></div>
<div id="results" class="results"></div>

<script>
const API_KEY = 'AIzaSyAhQt6ZK9IdKGQ0BrBPQYFsxQPP2EJ0C_U';
const STORAGE_KEY = 'anime_keywords';

function getKeywords() {
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
}

function saveKeywords(kws) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(kws));
}

function renderTags() {
  const kws = getKeywords();
  const el = document.getElementById('tagList');
  el.innerHTML = kws.map((k, i) => `
    <div class="tag">
      <span>${k}</span>
      <span class="del" onclick="removeKeyword(${i})">×</span>
    </div>
  `).join('');
}

function addKeyword() {
  const input = document.getElementById('keywordInput');
  const val = input.value.trim();
  if (!val) return;
  const kws = getKeywords();
  if (!kws.includes(val)) {
    kws.push(val);
    saveKeywords(kws);
    renderTags();
  }
  input.value = '';
}

function removeKeyword(i) {
  const kws = getKeywords();
  kws.splice(i, 1);
  saveKeywords(kws);
  renderTags();
}

document.getElementById('keywordInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addKeyword();
});

async function searchYT(query) {
  const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&order=date&maxResults=3&key=${API_KEY}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('API 錯誤 ' + res.status);
  const data = await res.json();
  return data.items || [];
}

function timeAgo(dateStr) {
  const diff = (Date.now() - new Date(dateStr)) / 1000;
  if (diff < 3600) return Math.floor(diff / 60) + ' 分鐘前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小時前';
  if (diff < 86400 * 30) return Math.floor(diff / 86400) + ' 天前';
  return new Date(dateStr).toLocaleDateString('zh-TW');
}

async function searchAll() {
  const kws = getKeywords();
  if (kws.length === 0) {
    document.getElementById('results').innerHTML = '<div class="empty">請先新增片名關鍵字</div>';
    return;
  }
  document.getElementById('results').innerHTML = '<div class="loading">搜尋中⋯</div>';
  let html = '';
  for (const kw of kws) {
    html += `<div class="section-title">「${kw}」最新影片</div>`;
    try {
      const items = await searchYT(kw);
      if (items.length === 0) {
        html += `<div class="empty">找不到結果</div>`;
      } else {
        for (const item of items) {
          const vid = item.id.videoId;
          const s = item.snippet;
          const thumb = s.thumbnails?.medium?.url || '';
          html += `
            <a class="video-card" href="https://www.youtube.com/watch?v=${vid}" target="_blank">
              <img class="thumb" src="${thumb}" alt="" />
              <div class="info">
                <div class="title">${s.title}</div>
                <div class="meta">${s.channelTitle} · ${timeAgo(s.publishedAt)}</div>
              </div>
            </a>`;
        }
      }
    } catch (e) {
      html += `<div class="error">搜尋失敗：${e.message}</div>`;
    }
  }
  document.getElementById('results').innerHTML = html;
}

renderTags();
</script>
</body>
</html>
